<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArtSense — Stay connected</title>
<meta name="description" content="ArtSense: patterns, illustration, and prints. Find ArtSense on Instagram, YouTube, Pinterest, and the ZaveCo shop.">
<meta property="og:title" content="ArtSense — Stay connected">
<meta property="og:description" content="Patterns, illustration, and prints.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#E3EBE2">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Gabarito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3EBE2; --card:#F5F8F3; --ink:#1F3A33; --muted:#4F6A60; --line:#C3D3C4;
  --green:#3E6B4F; --sage:#8FAE8B; --blue:#5B84A6; --mustard:#D9A43A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15211C;--card:#1D2C26;--ink:#E7EFE8;--muted:#A5BAAF;--line:#2F443B;}
}
:root[data-theme="dark"]{--bg:#15211C;--card:#1D2C26;--ink:#E7EFE8;--muted:#A5BAAF;--line:#2F443B;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gabarito",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;}
main{width:100%;max-width:26rem;padding:3rem 1.5rem 3rem;text-align:center}

.mandala{width:min(15rem,62vw);height:auto;display:block;margin:0 auto 1.75rem;
  animation:bloom 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes bloom{from{transform:rotate(-45deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.mandala{animation:none}}

h1{font-family:"Caprasimo",Georgia,serif;font-weight:400;font-size:3rem;line-height:1;margin:0;letter-spacing:.005em}
.tag{color:var(--muted);margin:.6rem 0 2.25rem;font-size:1.05rem}
h2{font-size:1rem;font-weight:500;color:var(--muted);margin:0 0 .9rem}

.links{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.links a{display:flex;align-items:center;gap:.9rem;padding:.95rem 1.1rem;
  background:var(--card);color:var(--ink);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;font-size:1.05rem;font-weight:500;text-align:left;
  transition:transform .15s ease,border-color .15s ease}
.links a:hover{transform:translateY(-2px);border-color:var(--sage)}
.links a:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
.links .dot{flex:none;width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;color:#fff}
.links .dot svg{width:1.1rem;height:1.1rem}
.links small{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.links li:nth-child(1) .dot{background:var(--blue)}
.links li:nth-child(2) .dot{background:var(--sage);color:#17302A}
.links li:nth-child(3) .dot{background:var(--green)}
.links li:nth-child(4) .dot{background:var(--mustard);color:#2C2208}

footer{margin-top:2.5rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <svg class="mandala" viewBox="-100 -100 200 200" role="img" aria-label="ArtSense flower mark">
    <defs>
      <g id="arm">
        <ellipse cx="0" cy="-58" rx="20" ry="36" fill="var(--sage)"/>
        <ellipse cx="0" cy="-60" rx="9" ry="22" fill="var(--green)"/>
        <circle cx="0" cy="-74" r="4" fill="var(--mustard)"/>
        <circle cx="0" cy="-62" r="3.2" fill="var(--mustard)"/>
        <circle cx="0" cy="-51" r="2.6" fill="var(--mustard)"/>
      </g>
      <g id="pod">
        <path d="M0 -30 C 14 -44, 18 -66, 0 -86 C -18 -66, -14 -44, 0 -30Z" fill="var(--blue)" opacity=".9"/>
        <circle cx="0" cy="-90" r="5" fill="var(--mustard)"/>
      </g>
    </defs>
    <g transform="rotate(45)"><use href="#pod"/><use href="#pod" transform="rotate(90)"/><use href="#pod" transform="rotate(180)"/><use href="#pod" transform="rotate(270)"/></g>
    <use href="#arm"/><use href="#arm" transform="rotate(90)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(270)"/>
    <circle r="22" fill="var(--mustard)"/>
    <circle r="13" fill="var(--blue)"/>
    <circle r="5" fill="var(--card)"/>
  </svg>

  <h1>ArtSense</h1>
  <p class="tag">Patterns, illustration, and prints</p>

  <h2>🌸 Stay connected</h2>
  <ul class="links">
    <li><a href="https://www.instagram.com/artsensegirl" target="_blank" rel="noopener">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></span>
      <span>Instagram<small>@artsensegirl</small></span></a></li>
    <li><a href="https://youtube.com/@artsensegirl" target="_blank" rel="noopener">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></span>
      <span>YouTube<small>@artsensegirl</small></span></a></li>
    <li><a href="https://pin.it/2AwzdXXJx" target="_blank" rel="noopener">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-7"/><path d="M8 3h8l-1 6 3 3v2H6v-2l3-3z"/></svg></span>
      <span>Pinterest<small>Boards and inspiration</small></span></a></li>
    <li><a href="https://zaveco.printify.me/" target="_blank" rel="noopener">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
      <span>Shop ZaveCo<small>Prints and products</small></span></a></li>
  </ul>

  <footer>© ArtSense</footer>
</main>
</body>
</html>
